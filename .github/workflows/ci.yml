name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    # 项目本身只跑在 Windows 上，检查也必须在 Windows 跑：
    # 静态检查要用 PSParser，渲染检查要真的建 WinForms 窗口。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 静态检查（语法 / 纯 ASCII / 禁用的 PS3+ 写法 / 文件清单）
        shell: powershell
        run: .\tests\static-check.ps1

      - name: 功能自测（配置读写 / 令牌 / 解压 / 目录展平）
        shell: powershell
        run: .\tests\common-check.ps1

      - name: 渲染与状态自检（离屏绘制所有窗口 + 真跑状态刷新）
        shell: powershell
        run: .\tests\render-check.ps1

      # 离线验证「国内连不上 GitHub」修复：镜像连通性探针、releases HTML 兜底、
      # ExpectJson/ExpectZip 拦截错误页、file:// 走托管 WebRequest 兜底。
      # 该用例强制 $script:CurlExe=$null，因此在自带 curl 的 Runner 上也能确定性的
      # 测到「无 curl（Win7）」那条降级路径。
      - name: GitHub 下载逻辑离线测试
        shell: powershell
        run: .\tests\github-check.ps1

      # 离线验证无人值守：NBOT_ASSUME_DEFAULTS=1 不卡 Read-Host、非交互环境回退默认、
      # 真实 install-core.ps1 configure 端到端退出 0 并写出配置（NBOT_TEST=1 跳过 Install-Self）。
      - name: 无人值守命令分发离线测试
        shell: powershell
        run: .\tests\unattended-check.ps1

      - name: 打包单文件安装器
        shell: powershell
        run: .\build-single-exe.ps1

      # 注意：run: 块里只能写 ASCII。Actions 会把它落成临时 .ps1 且不带 BOM，
      # Windows PowerShell 按 ANSI 读，中文会变乱码直接解析失败。
      - name: 校验产物能解压且与源码一致
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'verify'
          $proc = Start-Process -FilePath .\dist\NBotSetup.exe `
            -ArgumentList @('/extract', $out) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "extract failed, exit code $($proc.ExitCode)" }
          $count = @(Get-ChildItem $out -Recurse -File).Count
          Write-Host "extracted $count files"
          if ($count -lt 25) { throw "unexpected file count: $count" }
          foreach ($f in @('lib\common.ps1', 'gui.ps1', 'wizard.ps1', 'install-core.ps1')) {
            $a = (Get-FileHash $f).Hash
            $b = (Get-FileHash (Join-Path $out $f)).Hash
            if ($a -ne $b) { throw "$f does not match the source" }
          }
          Write-Host 'artifact matches sources byte for byte'

      - name: 上传安装器
        uses: actions/upload-artifact@v4
        with:
          name: NBotSetup
          path: dist/NBotSetup.exe
          if-no-files-found: error
